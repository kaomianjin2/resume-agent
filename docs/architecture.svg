<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">技术面试 Agent 项目架构图</title>
  <desc id="desc">展示交互式 CLI、GUI Runtime Facade、普通请求编排、对话路由、节点规划、节点执行、大模型调用、混合检索、SQLite 状态库和离线知识库构建之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="soft-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .note { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 16; }
      .runtime { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; rx: 14; }
      .logic { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 14; }
      .exec { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 14; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 14; }
      .offline { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.5; rx: 14; }
      .external { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; rx: 14; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#soft-arrow); }
      .dash-line { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#soft-arrow); }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 8 8; rx: 18; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1120"/>
  <text class="title" x="70" y="70">技术面试 Agent 项目架构图</text>
  <text class="subtitle" x="70" y="100">运行时只做交互、编排、检索和大模型调用；开发期离线构建知识库；会话状态与索引统一落在 SQLite。</text>

  <rect class="boundary" x="50" y="130" width="1500" height="610"/>
  <text class="section-title" x="74" y="162">运行时路径</text>
  <text class="tiny" x="178" y="162">启动时只检查知识库 ready 状态，不在运行期解析或构建原始资料。</text>

  <rect class="external" x="90" y="205" width="180" height="82"/>
  <text class="label" x="125" y="238">用户</text>
  <text class="small" x="115" y="263">自然语言 / /node</text>

  <rect class="runtime" x="340" y="190" width="230" height="112"/>
  <text class="label" x="384" y="225">交互式 CLI</text>
  <text class="small" x="375" y="252">cli.py</text>
  <text class="tiny" x="370" y="276">加载配置、检查 KB、循环输入</text>
  <text class="tiny" x="370" y="294">装配编排与展示回调</text>

  <rect class="runtime" x="340" y="65" width="230" height="96"/>
  <text class="label" x="371" y="100">GUI Runtime Facade</text>
  <text class="small" x="365" y="126">gui_runtime.py</text>
  <text class="tiny" x="370" y="146">结构化 status / route / plan / execute</text>

  <rect class="runtime" x="340" y="495" width="230" height="82"/>
  <text class="label" x="394" y="528">结果展示层</text>
  <text class="small" x="386" y="553">rendering.py</text>
  <text class="tiny" x="366" y="570">格式化节点结果与终端样式</text>

  <rect class="logic" x="650" y="450" width="230" height="70"/>
  <text class="label" x="704" y="480">模拟面试流程</text>
  <text class="small" x="694" y="506">mock_interview.py</text>
  <text class="tiny" x="682" y="522">复用 CLI 输入与展示回调</text>

  <rect class="data" x="340" y="350" width="230" height="112"/>
  <text class="label" x="390" y="385">项目配置</text>
  <text class="small" x="376" y="412">config/interview-agent.toml</text>
  <text class="tiny" x="390" y="436">LLM / embedding / storage</text>

  <rect class="logic" x="650" y="160" width="230" height="96"/>
  <text class="label" x="704" y="195">对话路由器</text>
  <text class="small" x="693" y="222">router.py</text>
  <text class="tiny" x="677" y="242">输出 needs_user_choice</text>

  <rect class="logic" x="650" y="310" width="230" height="108"/>
  <text class="label" x="696" y="346">节点规划器</text>
  <text class="small" x="693" y="373">planner.py</text>
  <text class="tiny" x="677" y="395">复用 state_contracts.py</text>

  <rect class="exec" x="960" y="235" width="240" height="118"/>
  <text class="label" x="1010" y="272">节点执行器</text>
  <text class="small" x="1028" y="299">executor.py</text>
  <text class="tiny" x="990" y="322">校验契约、执行节点、记录结果</text>

  <rect class="exec" x="1280" y="150" width="220" height="118"/>
  <text class="label" x="1322" y="186">节点注册表</text>
  <text class="small" x="1320" y="213">nodes/registry.py</text>
  <text class="tiny" x="1310" y="238">复用 state_contracts.py</text>

  <rect class="exec" x="1280" y="325" width="220" height="128"/>
  <text class="label" x="1302" y="361">面试节点处理器</text>
  <text class="small" x="1308" y="388">nodes/interview.py</text>
  <text class="tiny" x="1313" y="414">11 个节点归一化输出</text>

  <rect class="logic" x="960" y="500" width="240" height="112"/>
  <text class="label" x="1004" y="535">结构化运行时</text>
  <text class="small" x="1032" y="562">agents.py</text>
  <text class="tiny" x="987" y="586">渲染 prompt、注入 RAG、保护来源字段</text>

  <rect class="external" x="1280" y="535" width="220" height="96"/>
  <text class="label" x="1314" y="572">大模型客户端</text>
  <text class="small" x="1308" y="599">llm.py</text>
  <text class="tiny" x="1315" y="618">OpenAI-compatible API</text>

  <rect class="data" x="650" y="530" width="230" height="130"/>
  <text class="label" x="704" y="566">会话状态库</text>
  <text class="small" x="693" y="593">sessions</text>
  <text class="small" x="693" y="615">session_state</text>
  <text class="small" x="693" y="637">node_runs</text>

  <rect class="logic" x="910" y="650" width="270" height="58"/>
  <text class="label" x="950" y="676">状态契约</text>
  <text class="small" x="962" y="698">state_contracts.py</text>

  <rect class="data" x="90" y="545" width="480" height="112"/>
  <text class="label" x="236" y="580">SQLite 知识库索引</text>
  <text class="small" x="145" y="608">knowledge_documents / knowledge_chunks / knowledge_base_meta</text>
  <text class="small" x="195" y="632">knowledge_chunks_fts / knowledge_chunk_embeddings</text>

  <path class="line" d="M 270 246 L 340 246"/>
  <path class="line" d="M 270 226 C 300 170 315 113 340 113"/>
  <path class="soft-line" d="M 455 161 L 455 190"/>
  <path class="soft-line" d="M 570 113 C 620 113 620 195 650 195"/>
  <path class="soft-line" d="M 570 132 C 625 150 625 346 650 346"/>
  <path class="soft-line" d="M 570 151 C 650 240 850 260 960 282"/>
