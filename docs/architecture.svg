  <text class="note" x="300" y="232">输入</text>
  <text class="note" x="506" y="436">结果展示</text>
  <text class="note" x="590" y="202">路由契约</text>
  <text class="note" x="592" y="354">生成内部步骤</text>
  <text class="note" x="600" y="448">模拟面试流程</text>
  <text class="note" x="892" y="258">按计划执行</text>
  <text class="note" x="1216" y="198">读取节点契约</text>
  <text class="note" x="1216" y="382">调用处理函数</text>
  <text class="note" x="1217" y="572">结构化 JSON</text>
  <text class="note" x="810" y="580">校验后读写状态</text>
  <text class="note" x="675" y="526">检索上下文 + source metadata</text>

  <rect class="boundary" x="50" y="780" width="1500" height="280"/>
  <text class="section-title" x="74" y="812">离线知识库构建路径</text>
  <text class="tiny" x="232" y="812">开发期命令负责筛选、解析、切分、向量化和索引写入；失败会记录 failed 状态。</text>

  <rect class="offline" x="90" y="865" width="220" height="96"/>
  <text class="label" x="132" y="902">知识库源目录</text>
  <text class="small" x="126" y="929">/Users/cynicism/Desktop/面试</text>

  <rect class="offline" x="390" y="840" width="200" height="96"/>
  <text class="label" x="420" y="877">文件筛选策略</text>
  <text class="small" x="432" y="904">file_policy.py</text>
  <text class="tiny" x="430" y="922">包含 md/pdf/docx</text>

  <rect class="offline" x="390" y="960" width="200" height="70"/>
  <text class="label" x="430" y="997">文本解析器</text>
  <text class="small" x="430" y="1020">parser.py</text>

  <rect class="offline" x="670" y="865" width="220" height="96"/>
  <text class="label" x="708" y="902">文本切分</text>
  <text class="small" x="716" y="929">chunking.py</text>

  <rect class="offline" x="970" y="840" width="230" height="120"/>
  <text class="label" x="1012" y="878">知识库构建器</text>
  <text class="small" x="1024" y="905">kb/build.py</text>
  <text class="tiny" x="1000" y="930">building / ready / failed</text>

  <rect class="external" x="970" y="985" width="230" height="58"/>
  <text class="label" x="1004" y="1021">本地 bge-m3 向量模型</text>

  <rect class="data" x="1280" y="865" width="220" height="116"/>
  <text class="label" x="1312" y="902">SQLite 检索索引</text>
  <text class="small" x="1310" y="929">documents / chunks</text>
  <text class="small" x="1310" y="952">FTS5 / embeddings</text>

  <path class="line" d="M 310 913 L 390 890"/>
  <path class="line" d="M 590 888 C 625 888 625 913 670 913"/>
  <path class="line" d="M 590 995 C 630 995 635 937 670 926"/>
  <path class="line" d="M 890 913 L 970 900"/>
  <path class="line" d="M 1085 960 L 1085 985"/>
  <path class="line" d="M 1200 900 L 1280 913"/>
  <path class="dash-line" d="M 1400 865 C 1240 780 630 735 455 462"/>

  <text class="note" x="320" y="895">筛选</text>
  <text class="note" x="606" y="880">抽取正文</text>
  <text class="note" x="907" y="897">写入</text>
  <text class="note" x="1212" y="895">索引</text>
  <text class="note" x="1120" y="978">本地模型</text>
  <text class="note" x="1195" y="786">运行时只读检索</text>

  <rect class="panel" x="70" y="1040" width="1460" height="46"/>
  <text class="small" x="95" y="1069">关键约束：配置固定来自 config/interview-agent.toml；GUI Runtime Facade 只输出结构化数据；CLI 结果展示由 rendering.py 承接；节点输出校验后才写入 session_state。</text>
  <!-- 中文注释：本图把运行期交互链路和离线知识库构建链路分开，避免把“启动检查 ready 状态”和“构建知识库”混为同一流程。 -->
</svg>
