  <text class="title" x="900" y="70" text-anchor="middle">技术面试 Agent 系统架构图</text>
  <text class="subtitle" x="900" y="102" text-anchor="middle">本地桌面与 CLI 双入口共用编排核心；运行时只读 ready 知识库，节点、求职采集进度、LLM prompt 和平台适配器契约经敏感边界校验后进入本地数据面。</text>

