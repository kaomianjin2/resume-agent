      .label { font: 760 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 520 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 410 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .chip { font: 680 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.6px; fill: #4b5563; }
      .edge-label { font: 680 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .card { fill: #ffffff; stroke-width: 2.2; rx: 18; filter: url(#card-shadow); }
      .hub { fill: #fffdf7; stroke: #f59e0b; }
      .client { fill: #f7fbff; stroke: #3b82f6; }
      .runtime { fill: #f9f7ff; stroke: #8b5cf6; }
      .flow { fill: #f6fffb; stroke: #10b981; }
      .node { fill: #fff7f3; stroke: #f97316; }
      .data { fill: #f8fafc; stroke: #64748b; }
      .offline { fill: #fff6fb; stroke: #ec4899; }
      .external { fill: #f7fee7; stroke: #84cc16; }
      .band { fill: #f8fafc; stroke: #d1d5db; stroke-width: 1.4; rx: 24; }
      .band-light { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 22; }
      .line { stroke: #1f2937; stroke-width: 2.3; fill: none; marker-end: url(#arrow-dark); }
      .soft-line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow-muted); }
      .dash-line { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow-muted); }
      .bus { stroke: #111827; stroke-width: 3.2; fill: none; marker-end: url(#arrow-dark); }
